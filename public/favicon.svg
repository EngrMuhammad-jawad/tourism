  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="18" fill="url(#dtbFavDark)" stroke="url(#dtbFavGold)" stroke-width="2" />
  <rect x="3.5" y="3.5" width="57" height="57" rx="15" fill="none" stroke="url(#dtbFavGold)" stroke-width="0.8" stroke-opacity="0.4" />

