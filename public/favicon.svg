      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#E5A93C" />
      <stop offset="70%" stop-color="#C5841D" />
      <stop offset="100%" stop-color="#8C5808" />
    </linearGradient>
    <linearGradient id="dtbFavDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C20" />
      <stop offset="100%" stop-color="#08090A" />
