  <path d="M30.8 24 L 31.4 15 L 32.6 15 L 33.2 24 Z" fill="#FFE59E" />
  <path d="M31.6 15 L 32 7 L 32.4 15 Z" fill="#FFFFFF" />

  <!-- Summit Starburst -->
