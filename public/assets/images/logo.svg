<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64" fill="none">
  <defs>
    <linearGradient id="dtbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#E5A93C" />
      <stop offset="70%" stop-color="#C5841D" />
      <stop offset="100%" stop-color="#8C5808" />
    </linearGradient>
    <linearGradient id="dtbDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2024" />
      <stop offset="100%" stop-color="#0A0B0D" />
    </linearGradient>
    <filter id="dtbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Icon Container (Square Rounded) -->
  <g transform="translate(6, 4)">
    <rect width="56" height="56" rx="16" fill="url(#dtbDark)" stroke="url(#dtbGold)" stroke-width="1.5" />
    <!-- Inner Accent Ring -->
    <rect x="3" y="3" width="50" height="50" rx="13" fill="none" stroke="url(#dtbGold)" stroke-width="0.75" stroke-opacity="0.35" />

    <!-- Open Book / Wings Motif -->
    <path d="M14 42 C 20 38, 25 39, 28 41 C 31 39, 36 38, 42 42 C 40 34, 35 34, 28 36 C 21 34, 16 34, 14 42 Z" 
          fill="url(#dtbGold)" opacity="0.9" />

    <!-- Stylized Burj Khalifa Spire rising from Book -->
    <!-- Base Spire -->
    <path d="M26 36 L 27 22 L 29 22 L 30 36 Z" fill="url(#dtbGold)" />
    <!-- Mid Needle Tier -->
    <path d="M26.8 22 L 27.4 14 L 28.6 14 L 29.2 22 Z" fill="#FFE59E" />
    <!-- Peak Tip -->
    <path d="M27.6 14 L 28 7 L 28.4 14 Z" fill="#FFFFFF" />
    <!-- Starburst on top -->
    <circle cx="28" cy="7" r="1.5" fill="#FFF8E7" filter="url(#dtbGlow)" />
    <!-- Desert Dune / Moon Crescent Arc -->
    <path d="M16 26 C 18 19, 24 14, 32 15 C 26 18, 22 23, 20 29 Z" fill="url(#dtbGold)" opacity="0.7" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(74, 16)">
    <!-- Main Title -->
    <text x="0" y="24" font-family="'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="0.5" fill="#FFFFFF">
      DUBAI
    </text>
    <text x="76" y="24" font-family="'Inter', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" letter-spacing="0.5" fill="url(#dtbGold)">
      TOUR BOOK
    </text>

    <!-- Subtitle / Tagline -->
    <text x="2" y="38" font-family="'Inter', 'Montserrat', sans-serif" font-size="8.5" font-weight="700" letter-spacing="2.8" fill="#C5841D" text-transform="uppercase">
      LUXURY EXPERIENCES &amp; SAFARIS
    </text>
  </g>
</svg>
